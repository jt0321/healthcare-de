services:
  minio:
    image: minio/minio
    ports: [ "9000:9000", "9001:9001" ]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data

  polaris-bootstrap-db:
    image: apache/polaris-admin-tool:latest
    environment:
      polaris.persistence.type: relational-jdbc
      quarkus.datasource.db-kind: postgresql
      quarkus.datasource.username: ${POSTGRES_USER}
      quarkus.datasource.password: ${POSTGRES_PASSWORD}
      quarkus.datasource.jdbc.url: jdbc:postgresql://postgres:5432/polaris
    entrypoint: ["/bin/sh", "/polaris-admin-bootstrap.sh"]
    volumes:
      - ./polaris-admin-bootstrap.sh:/polaris-admin-bootstrap.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  polaris:
    image: apache/polaris:latest
    ports:
      - "8181:8181"
      - "8182:8182"
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password123
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      polaris.realm-context.realms: POLARIS
      quarkus.otel.sdk.disabled: "true"
      # dbt-trino's table materialization drops a temp "__dbt_backup" table on every
      # rerun; Polaris blocks purge-on-drop by default as a safety gate.
      polaris.features."DROP_WITH_PURGE_ENABLED": "true"
      # Persist catalogs/namespaces/grants in Postgres instead of Polaris's default
      # in-memory store, so they survive container restarts (the Iceberg data itself
      # always lived safely in MinIO regardless -- this is just Polaris's own bookkeeping).
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      minio:
        condition: service_started
      postgres:
        condition: service_healthy
      polaris-bootstrap-db:
        condition: service_completed_successfully

  minio-setup:
    image: minio/minio
    entrypoint: /bin/sh
    command: -c "mc alias set myminio http://minio:9000 admin password123 && mc mb --ignore-existing myminio/healthcare"
    depends_on:
      - minio

  polaris-setup:
    image: alpine:latest
    depends_on:
      polaris:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    volumes:
      - ./polaris-bootstrap.sh:/polaris-bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/polaris-bootstrap.sh"]

  synthea:
    build:
      context: .
      dockerfile: Dockerfile.synthea
    volumes:
      - ./data:/output
    command: -p 1000 --exporter.csv.export=true --exporter.fhir.export=true

  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-polaris-db.sh:/docker-entrypoint-initdb.d/init-polaris-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      - postgres
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      - AIRFLOW__CORE__EXECUTOR=${AIRFLOW__CORE__EXECUTOR}
    command: >
      bash -c " airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com "

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - airflow-init
      - minio
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
      - AWS_ENDPOINT_URL=http://minio:9000
      - AIRFLOW_CONN_TRINO_DEFAULT=trino://trino@trino:8080/iceberg
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      - postgres
      - airflow-init
      - minio
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      - AIRFLOW__CORE__EXECUTOR=${AIRFLOW__CORE__EXECUTOR}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL}
      - AIRFLOW_CONN_TRINO_DEFAULT=trino://trino@trino:8080/iceberg
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID}" # host's docker group GID, needed for LocalExecutor tasks (DockerOperator) to reach the socket
    command: scheduler

  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    volumes:
      - ./dbt_project:/usr/app
    working_dir: /usr/app
    environment:
      - S3_ENDPOINT=minio:9000
    depends_on:
      - minio

  dashboard:
    build:
      context: ./dashboard
    ports: [ "8501:8501" ]
    volumes:
      - ./dashboard:/app
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
      - AWS_ENDPOINT_URL=http://minio:9000
    depends_on:
      - minio

  trino-metastore-init:
    image: trinodb/trino:455
    user: root
    entrypoint: ["chown", "-R", "1000:1000", "/etc/trino/file-metastore"]
    volumes:
      - trino-metastore:/etc/trino/file-metastore

  trino:
    image: trinodb/trino:455
    ports:
      - "8082:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - trino-metastore:/etc/trino/file-metastore
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL}
    depends_on:
      minio:
        condition: service_started
      polaris-setup:
        condition: service_completed_successfully
      trino-metastore-init:
        condition: service_completed_successfully

volumes:
  trino-metastore:
  postgres-data:
