<text x="593" y="620.0" font-family="Poppins" font-size="19" font-weight="normal" fill="#9a9a9a" text-anchor="start">the shared volume,</text>
<text x="593" y="651.0" font-family="Poppins" font-size="19" font-weight="normal" fill="#9a9a9a" text-anchor="start">deltas included</text>
<rect x="567" y="708.0" width="276" height="204" rx="10" fill="none" stroke="#4f4f4f" stroke-width="1.8"/>
<text x="593" y="754.0" font-family="Poppins" font-size="27" font-weight="bold" fill="#ffffff" text-anchor="start">Stage ×6</text>
<text x="593" y="792.0" font-family="Poppins" font-size="17" font-weight="normal" fill="#9a9a9a" text-anchor="start">every version of a row,</text>
<text x="593" y="823.0" font-family="Poppins" font-size="17" font-weight="normal" fill="#9a9a9a" text-anchor="start">not just the newest</text>
<text x="593" y="854.0" font-family="Poppins" font-size="17" font-weight="normal" fill="#9a9a9a" text-anchor="start">Parquet into MinIO</text>
<text x="593" y="885.0" font-family="Poppins" font-size="17" font-weight="normal" fill="#9a9a9a" text-anchor="start">s3://healthcare/staging/</text>
