<text x="146" y="486.5" font-family="Poppins" font-size="18" font-weight="normal" fill="#9a9a9a" text-anchor="start">patients · encounters</text>
<text x="146" y="517.5" font-family="Poppins" font-size="18" font-weight="normal" fill="#9a9a9a" text-anchor="start">conditions · CSV, nightly</text>
<rect x="120" y="588.5" width="320" height="173" rx="10" fill="none" stroke="#ffffff" stroke-width="1.8"/>
<text x="146" y="634.5" font-family="Poppins" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="start">HIE feed</text>
<text x="146" y="672.5" font-family="Poppins" font-size="18" font-weight="normal" fill="#9a9a9a" text-anchor="start">FHIR R4 bundles in the</text>
<text x="146" y="703.5" font-family="Poppins" font-size="18" font-weight="normal" fill="#9a9a9a" text-anchor="start">sender&#x27;s own id space</text>
<text x="146" y="734.5" font-family="Poppins" font-size="18" font-weight="normal" fill="#9a9a9a" text-anchor="start">demographics drift</text>
<rect x="120" y="805.5" width="320" height="142" rx="10" fill="none" stroke="#ffffff" stroke-width="1.8"/>
<text x="146" y="851.5" font-family="Poppins" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="start">Corrections</text>
<text x="146" y="889.5" font-family="Poppins" font-size="18" font-weight="normal" fill="#9a9a9a" text-anchor="start">data/delta/*.csv</text>
<text x="146" y="920.5" font-family="Poppins" font-size="18" font-weight="normal" fill="#9a9a9a" text-anchor="start">repriced · recoded · voided</text>
<text x="120" y="1065" font-family="Poppins" font-size="19" font-weight="normal" fill="#6a6a6a" text-anchor="start">Run by hand, behind a Compose profile. Airflow never</text>
<text x="120" y="1094" font-family="Poppins" font-size="19" font-weight="normal" fill="#6a6a6a" text-anchor="start">starts them — it only notices what they leave behind.</text>
